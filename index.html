<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>致 汪静婷女士 · 生日快乐</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
    background: linear-gradient(135deg, #fdf6f0 0%, #f8e8dc 50%, #f5d5e0 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    color: #4a3f3a;
  }

  /* 飘落的花瓣 */
  .petal {
    position: fixed;
    top: -20px;
    font-size: 20px;
    pointer-events: none;
    opacity: 0.7;
    animation: fall linear infinite;
    z-index: 1;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); }
    100% { transform: translateY(100vh) rotate(720deg); }
  }

  /* 光晕背景 */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  .glow-1 { width: 400px; height: 400px; background: #ffb6c1; top: -100px; right: -100px; animation: float 8s ease-in-out infinite; }
  .glow-2 { width: 350px; height: 350px; background: #e8d5b7; bottom: -80px; left: -80px; animation: float 10s ease-in-out infinite reverse; }
  .glow-3 { width: 280px; height: 280px; background: #d4e5f7; top: 40%; left: 60%; animation: float 12s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, -40px); }
  }

  .container {
    position: relative;
    z-index: 10;
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 30px;
    text-align: center;
  }

  /* 顶部装饰线 */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
    color: #c49b83;
    font-size: 14px;
    letter-spacing: 6px;
  }
  .divider::before,
  .divider::after {
    content: '';
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c49b83, transparent);
  }

  .label {
    font-size: 15px;
    letter-spacing: 8px;
    color: #b08968;
    margin-bottom: 15px;
    animation: fadeDown 1.2s ease;
  }

  h1 {
    font-family: "Ma Shan Zheng", "Noto Serif SC", cursive;
    font-size: clamp(42px, 8vw, 68px);
    font-weight: 400;
    background: linear-gradient(135deg, #d45a8a, #c49b83, #a67c93);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    animation: fadeUp 1.2s ease 0.3s both;
  }

  .subtitle {
    font-size: 18px;
    color: #8b7355;
    letter-spacing: 10px;
    margin-bottom: 40px;
    animation: fadeUp 1.2s ease 0.5s both;
  }

  /* 主卡片 */
  .card {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 20px 60px rgba(196, 155, 131, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
    padding: 50px 40px;
    animation: fadeUp 1.2s ease 0.7s both;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 18px;
    border: 1px dashed rgba(196, 155, 131, 0.3);
    pointer-events: none;
  }

  .cake-icon {
    font-size: 72px;
    margin-bottom: 25px;
    animation: bounce 2s ease infinite;
    display: inline-block;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .wish-text {
    font-family: "Noto Serif SC", serif;
    font-size: 19px;
    line-height: 2.2;
    color: #5a4a42;
    letter-spacing: 2px;
    margin-bottom: 30px;
  }
  .wish-text .highlight {
    background: linear-gradient(120deg, #ffe4e1, #ffe4e1);
    padding: 2px 10px;
    border-radius: 6px;
    color: #d45a8a;
    font-weight: 500;
  }

  /* 祝福卡片组 */
  .wish-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 30px;
  }
  .wish-item {
    background: rgba(255, 255, 255, 0.7);
    border-radius: 16px;
    padding: 22px 12px;
    transition: all 0.4s ease;
    border: 1px solid rgba(196, 155, 131, 0.15);
  }
  .wish-item:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(212, 90, 138, 0.18);
    background: rgba(255, 255, 255, 0.95);
  }
  .wish-item .icon {
    font-size: 32px;
    margin-bottom: 8px;
  }
  .wish-item .text {
    font-size: 14px;
    color: #8b7355;
    letter-spacing: 1px;
  }

  /* 蜡烛按钮 */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 40px;
    background: linear-gradient(135deg, #d45a8a, #e8a0b4);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-family: inherit;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(212, 90, 138, 0.35);
    transition: all 0.3s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(212, 90, 138, 0.5);
  }
  .btn:active { transform: translateY(0); }

  .signature {
    margin-top: 40px;
    font-size: 14px;
    color: #b08968;
    letter-spacing: 4px;
  }
  .signature .from {
    font-family: "Ma Shan Zheng", cursive;
    font-size: 18px;
    color: #d45a8a;
  }

  /* 蛋糕弹窗 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    animation: fadeIn 0.4s ease;
  }
  .overlay.show { display: flex; }
  .modal {
    background: linear-gradient(135deg, #fff5f7, #fff);
    border-radius: 28px;
    padding: 50px 40px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    position: relative;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal .big-cake { font-size: 90px; margin-bottom: 20px; display: block; }
  .modal p { font-size: 20px; color: #d45a8a; letter-spacing: 4px; margin-bottom: 25px; font-weight: 500; }
  .modal button {
    padding: 10px 30px;
    background: #d45a8a;
    color: #fff;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
    letter-spacing: 2px;
    font-family: inherit;
  }

  /* 烟花 */
  .firework {
    position: fixed;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1000;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn   { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }

  @media (max-width: 560px) {
    .card { padding: 35px 22px; }
    .wish-grid { grid-template-columns: 1fr; }
    .container { padding: 40px 18px; }
  }
</style>
</head>
<body>

  <!-- 装饰光晕 -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="container">

    <div class="label">· HAPPY BIRTHDAY ·</div>

    <h1>致 汪静婷 女士</h1>
    <p class="subtitle">生 · 日 · 快 · 乐</p>

    <div class="card">
      <div class="cake-icon">🎂</div>

      <p class="wish-text">
        愿你眼角带笑，岁月不染眉梢<br>
        愿你<strong class="highlight">永远十八岁</strong>，清澈明朗，温柔坦荡<br>
        愿所有美好如期而至，愿往后日子，皆是你喜欢的模样
      </p>

      <div class="wish-grid">
        <div class="wish-item">
          <div class="icon">🌸</div>
          <div class="text">芳华永驻</div>
        </div>
        <div class="wish-item">
          <div class="icon">✨</div>
          <div class="text">万事胜意</div>
        </div>
        <div class="wish-item">
          <div class="icon">💗</div>
          <div class="text">被爱环绕</div>
        </div>
        <div class="wish-item">
          <div class="icon">🍀</div>
          <div class="text">好运常伴</div>
        </div>
        <div class="wish-item">
          <div class="icon">📚</div>
          <div class="text">从容优雅</div>
        </div>
        <div class="wish-item">
          <div class="icon">🌙</div>
          <div class="text">安稳喜乐</div>
        </div>
      </div>

      <button class="btn" onclick="blowCandle()">🎇 点我许愿</button>

      <div class="signature">
        —— 来自 <span class="from">BHF</span> 的诚挚祝福
      </div>
    </div>

  </div>

  <!-- 弹窗 -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <span class="big-cake">🎂🎂🎂</span>
      <p>愿望已收到 ✨<br>静婷女士，生日快乐！</p>
      <button onclick="closeModal()">收下祝福</button>
    </div>
  </div>

<script>
  // 生成飘落花瓣
  (function petals() {
    const emojis = ['🌸', '🌷', '💮', '🌺', '✨'];
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (8 + Math.random() * 10) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.fontSize = (14 + Math.random() * 16) + 'px';
      document.body.appendChild(p);
    }
  })();

  // 点蜡烛 - 放烟花 + 弹窗
  function blowCandle() {
    // 烟花
    const colors = ['#d45a8a', '#e8a0b4', '#ffd700', '#ff8c94', '#a67c93', '#fff'];
    for (let i = 0; i < 6; i++) {
      setTimeout(() => launchFirework(colors), i * 250);
    }
    setTimeout(() => document.getElementById('overlay').classList.add('show'), 800);
  }

  function launchFirework(colors) {
    const cx = Math.random() * window.innerWidth;
    const cy = Math.random() * window.innerHeight * 0.6;
    for (let i = 0; i < 30; i++) {
      const f = document.createElement('div');
      f.className = 'firework';
      f.style.left = cx + 'px';
      f.style.top  = cy + 'px';
      f.style.background = colors[Math.floor(Math.random() * colors.length)];
      f.style.boxShadow  = `0 0 8px ${f.style.background}`;
      document.body.appendChild(f);
      const angle = (Math.PI * 2 * i) / 30;
      const dist  = 60 + Math.random() * 80;
      f.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }
      ], { duration: 900, easing: 'ease-out' });
      setTimeout(() => f.remove(), 900);
    }
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('show');
  }
</script>
</body>
</html>
